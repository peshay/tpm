name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.15 is a release candidate (final: 2026-10-01). It runs as an early
        # warning only, so a broken rc can't block a PR.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    continue-on-error: ${{ matrix.python-version == '3.15' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Needed while 3.15 has no final release; no effect on stable versions.
          allow-prereleases: true
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Public artifact guard
        run: pre-commit run --all-files

      - name: Ruff
        run: ruff check tpm.py tests tools

      - name: Tests with coverage
        run: pytest --cov=tpm --cov=tools --cov-report=xml tests/

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          use_oidc: true
          files: ./coverage.xml

  sonarcloud:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history lets SonarQube Cloud attribute new code accurately.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests with coverage
        run: pytest --cov=tpm --cov=tools --cov-report=xml tests/

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
