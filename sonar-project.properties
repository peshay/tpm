# SonarQube Cloud (SonarCloud) configuration.
# Project key and organization are the defaults SonarCloud assigns when
# importing a GitHub repo (<org>_<repo> / <org>); adjust if your SonarCloud
# organization differs.
sonar.projectKey=peshay_tpm
sonar.organization=peshay

sonar.projectName=tpm

# Source vs. test layout.
sonar.sources=tpm.py,tools
sonar.tests=tests

# Test fixtures are data, not code to analyze.
sonar.exclusions=tests/resources/**

# Duplication in test scaffolding (e.g. the shared fake_data helper that is
# copied per test module) is acceptable; don't measure duplication on tests.
sonar.cpd.exclusions=tests/**

# Hard-coded "credentials" in the test suite are fixtures, not real secrets,
# so ignore the hard-coded-credentials rule within tests only.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S6437
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**

# Supported runtimes (matches requires-python in pyproject.toml).
sonar.python.version=3.10,3.11,3.12,3.13,3.14

# Coverage import requires CI-based analysis (the scanner uploading
# coverage.xml); SonarCloud's no-CI "Automatic Analysis" does not import it.
sonar.python.coverage.reportPaths=coverage.xml
