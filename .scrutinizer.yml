# Scrutinizer build configuration.
# The package targets Python >=3.10 (see pyproject.toml). The legacy default
# environment used an older interpreter where requests>=2.33.0 is not
# installable, so pin a modern Python and build with the project's own extras.
build:
  environment:
    python: '3.10.14'
  dependencies:
    override:
      - pip install -e ".[dev]"
  tests:
    override:
      - command: pytest --cov=tpm --cov-report=xml tests/
        coverage:
          file: coverage.xml
          format: py-cc
  nodes:
    analysis:
      tests:
        override:
          - py-scrutinizer-run
